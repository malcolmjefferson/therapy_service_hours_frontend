name: ci

# Frontend PR gates (FE tooling §11): lint (incl. FE-43), type check, format, tests, build and
# dependency audit. Deploys run in CodePipeline after merge, never here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (SEC-71)
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Generated API types match the pinned spec (ADR-0006)
        run: npm run api:types:check
      - name: Type check
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
